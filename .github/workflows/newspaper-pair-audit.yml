name: Newspaper pair audit
on:
  pull_request:
    paths: ["extension/sentence-signals/audit-newspaper-pairs.mjs", "extension/sentence-signals/collect-newspaper-sample.py", ".github/workflows/newspaper-pair-audit.yml"]
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch newspaper sample into runner temporary storage
        run: |
          python -m pip install requests beautifulsoup4 trafilatura
          python extension/sentence-signals/collect-newspaper-sample.py "$RUNNER_TEMP/newspaper-sample.json"
      - run: npm --prefix extension install --no-package-lock --no-audit
      - run: node --test extension/sentence-signals/analyse.test.mjs
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1"
      - run: python -m pip install "optimum-onnx[onnxruntime]>=0.1,<0.2" "transformers>=4.51,<5"
      - run: python extension/sentence-signals/prepare_clickbait.py
      - run: node extension/sentence-signals/analyse.mjs --warm > "$RUNNER_TEMP/warm.json"
      - name: Score pairs locally and print only aggregate results and source URLs
        run: node extension/sentence-signals/audit-newspaper-pairs.mjs "$RUNNER_TEMP/newspaper-sample.json"
      - name: Delete temporary article text
        if: always()
        run: rm -f "$RUNNER_TEMP/newspaper-sample.json"
