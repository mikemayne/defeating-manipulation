name: Real GUM implied-conclusion end-to-end experiment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/implicit-gum-e2e.yml
      - scripts/evaluate-implicit-real-gum.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: implied-real-gum-e2e
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned local model runtime
        run: |
          cd extension
          npm ci --no-audit --no-fund --onnxruntime-node-install-cuda=skip
      - name: Inspect 180 genuine GUM TRAIN paragraphs without model inference
        run: node scripts/evaluate-implicit-real-gum.mjs --sample-only
      - name: Run FLAN-T5 reconstruction and local MNLI premise checker
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_OFFLINE: "0"
        run: node scripts/evaluate-implicit-real-gum.mjs --run
