name: Validate rhetorical signal module

on:
  pull_request:
    paths:
      - 'extension/src/rhetorical-signals.mjs'
      - 'scripts/test-rhetorical-signals.mjs'
      - 'docs/rhetorical-signals-design.md'
      - '.github/workflows/validate-rhetorical-signals.yml'
  push:
    branches: [main]
    paths:
      - 'extension/src/rhetorical-signals.mjs'
      - 'scripts/test-rhetorical-signals.mjs'
      - '.github/workflows/validate-rhetorical-signals.yml'

permissions:
  contents: read

jobs:
  test-rhetorical-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify independent rhetorical routing and false-positive guards
        run: node scripts/test-rhetorical-signals.mjs
