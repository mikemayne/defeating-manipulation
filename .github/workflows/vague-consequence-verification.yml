name: Vague consequence verification
on:
  pull_request:
    paths: ["extension/sentence-signals/**", ".github/workflows/vague-consequence-verification.yml"]
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm --prefix extension install --no-package-lock --no-audit
      - run: node --test extension/sentence-signals/analyse.test.mjs
      - run: npx --no-install esbuild sentence-signals/sentence-analyser.mjs --bundle --platform=browser --format=esm --outfile=/tmp/sentence-analyser.mjs
        working-directory: extension
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1"
      - run: python -m pip install "optimum-onnx[onnxruntime]>=0.1,<0.2" "transformers>=4.51,<5"
      - run: python extension/sentence-signals/prepare_clickbait.py
      - run: node extension/sentence-signals/analyse.mjs --warm > /tmp/warm.json
      - run: node --test extension/sentence-signals/analyse.test.mjs
        env:
          SENTENCE_LIVE: "1"
      - name: Score the ten original sentences offline
        run: |
          node extension/sentence-signals/analyse.mjs --file extension/sentence-signals/vague-consequence-cases.json > /tmp/vague-consequence-scores.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const read = path => JSON.parse(readFileSync(path, 'utf8'));
          const cases = read('extension/sentence-signals/vague-consequence-cases.json');
          const results = read('/tmp/vague-consequence-scores.json');
          assert.equal(results.length, 10);
          assert.deepEqual(results.map(x => x.analysisText), cases.map(x => x.sentence));
          assert.deepEqual(results.flatMap(x => x.signals.grammar.map(flag => flag.original)), ['They was', "He don't"]);
          for (const [index, result] of results.entries()) console.log('VAGUE_SCORE ' + JSON.stringify({id: index + 1, ...cases[index], ...result}));
          JS
