name: Sentence signal pilot
on:
  push:
    branches: [six-model-sentence-pilot]
    paths: [".github/workflows/sentence-signal-pilot.yml", "extension/sentence-signals/**"]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: node --test extension/sentence-signals/analyse.test.mjs
      - run: npm --prefix extension ci
      - run: python -m pip install "spacy>=3.8,<3.9" "optimum-onnx[onnxruntime]>=0.1,<0.2" "transformers>=4.51,<5" "torch>=2.6"
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
      - run: python -m spacy download en_core_web_sm
      - run: python extension/sentence-signals/prepare_clickbait.py
      - run: node extension/sentence-signals/analyse.mjs --warm
      - run: node extension/sentence-signals/analyse.mjs --file extension/sentence-signals/cases.json
