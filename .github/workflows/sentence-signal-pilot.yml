name: Sentence signal pilot
on:
  pull_request:
    paths: [".github/workflows/sentence-signal-pilot.yml", "extension/sentence-signals/**"]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: node --test extension/sentence-signals/analyse.test.mjs
      - run: npm --prefix extension install --no-package-lock --no-audit
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1"
      - run: python -m pip install "spacy>=3.8,<3.9" "optimum-onnx[onnxruntime]>=0.1,<0.2" "transformers>=4.51,<5"
      - run: python -m spacy download en_core_web_sm
      - run: python extension/sentence-signals/prepare_clickbait.py
      - run: node extension/sentence-signals/analyse.mjs --warm
      - run: node --test extension/sentence-signals/analyse.test.mjs
        env:
          SENTENCE_LIVE: '1'

