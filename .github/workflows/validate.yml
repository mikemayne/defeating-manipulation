name: Validate project

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate catalogue and generated pages
        run: node scripts/test-build.mjs
      - name: Test explicit connector normalisation
        run: node scripts/test-reader-connector-normalisation.mjs
      - name: Test masked infill benchmark without model downloads
        run: |
          node --check extension/src/reader-mask-infill.mjs
          node --check scripts/evaluate-reader-mask-infill.mjs
          node scripts/evaluate-reader-mask-infill.mjs --preview
          node scripts/test-reader-mask-infill.mjs
      - name: Test offline GPT2 and BERT score fusion
        run: |
          node --check scripts/evaluate-reader-fusion.mjs
          node scripts/test-reader-fusion.mjs
      - name: Evaluate matching logic on hundreds of labelled examples
        run: node extension/evaluate.mjs --strict
      - name: Bundle Firefox and local benchmark workers
        run: |
          cd extension
          npm install --no-audit --no-fund --onnxruntime-node-install-cuda=skip
          npm run build
          test -s matcher-worker.js
          test -s benchmark-worker.js
